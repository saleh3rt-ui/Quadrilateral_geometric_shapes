<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم الأشكال الرباعية | الصف السابع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: linear-gradient(135deg, #ddd6fe 0%, #ede9fe 50%, #f5f3ff 100%);
  --header-bg: linear-gradient(135deg, #7c3aed, #a78bfa);
  --accent: #7c3aed; --accent-dark: #5b21b6; --soft: #c4b5fd; --lighter: #ede9fe;
  --text: #3b0764; --muted: #6d28d9;
  --card: rgba(255,255,255,0.98); --panel: rgba(245,240,255,0.98);
  --border: #c4b5fd; --f1: #c4b5fd; --f2: #ddd6fe; --f3: #ede9fe;
  --stroke: #7c3aed; --btn: linear-gradient(135deg, #7c3aed, #a78bfa);
  --shadow: rgba(124, 58, 237, 0.2);
  --success: #059669; --danger: #dc2626;
  --p1-color: #7c3aed; --p2-color: #a855f7;
}
[data-theme="pink"] {
  --bg: linear-gradient(135deg, #fbcfe8 0%, #fce7f3 50%, #fdf2f8 100%);
  --header-bg: linear-gradient(135deg, #db2777, #f472b6);
  --accent: #db2777; --accent-dark: #9d174d; --soft: #f9a8d4; --lighter: #fce7f3;
  --text: #831843; --muted: #be185d;
  --panel: rgba(252,231,243,0.98); --border: #f9a8d4;
  --f1: #f9a8d4; --f2: #fbcfe8; --f3: #fce7f3;
  --stroke: #db2777; --btn: linear-gradient(135deg, #db2777, #f472b6);
  --shadow: rgba(219, 39, 119, 0.2);
  --p1-color: #db2777; --p2-color: #f472b6;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body { background: var(--bg); min-height: 100vh; padding: 12px; color: var(--text); transition: 0.5s; font-size: 1em; }
.wrap { max-width: 1100px; margin: auto; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 50px var(--shadow); }

.school-header {
  background: var(--header-bg);
  padding: 22px 18px;
  text-align: center;
  color: #fff;
  border-bottom: 4px solid rgba(255,255,255,0.3);
  box-shadow: 0 4px 20px rgba(107, 33, 168, 0.2);
}
.header-row-1 { margin-bottom: 14px; }
.school-header h1 { font-size: 1.7em; font-weight: 900; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.15); letter-spacing: 0.5px; }
.main-badge { background: rgba(255,255,255,0.3); font-size: 0.95em; padding: 6px 20px; display: inline-block; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.4); }
.header-row-2 { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.meta-badge { background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85em; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.3); transition: 0.3s; }
.meta-badge:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }

.tabs {
  display: flex;
  flex-wrap: wrap;
  background: rgba(255,255,255,0.5);
  padding: 8px;
  gap: 5px;
  justify-content: center;
}

.tab {
  flex: 1 1 auto;
  min-width: 90px;
  max-width: 120px;
  padding: 8px 8px;
  text-align: center;
  cursor: pointer;
  font-weight: 700;
  color: var(--muted);
  border-radius: 10px;
  background: rgba(255,255,255,0.7);
  border: 2px solid var(--border);
  transition: 0.3s;
  font-size: 0.75em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  box-sizing: border-box;
}
.tab:hover { background: rgba(255,255,255,0.95); transform: translateY(-2px); }
.tab.active {
  border-color: var(--accent);
  background: #fff;
  color: var(--accent-dark);
  box-shadow: 0 4px 15px var(--shadow);
  font-weight: 900;
}

main { padding: 18px; }
.sec { display: none; animation: fade 0.4s; }
.sec.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h2.section-title { font-size: 1.3em; font-weight: 900; border-right: 5px solid var(--accent-dark); padding-right: 10px; margin-bottom: 12px; color: var(--accent-dark); }
h3 { font-size: 1.05em; font-weight: 800; margin: 10px 0 6px; color: var(--accent-dark); }

.box { background: var(--panel); border: 2px solid var(--border); border-right: 5px solid var(--accent-dark); border-radius: 12px; padding: 12px; margin: 10px 0; line-height: 1.7; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.example-box { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border: 2px solid #c084fc; border-radius: 12px; padding: 10px; margin: 10px 0; }
.example-box h4 { color: #6b21a8; margin-bottom: 6px; }
.example-box .examples { display: flex; gap: 8px; flex-wrap: wrap; }
.example-box .ex-item { background: #fff; padding: 5px 10px; border-radius: 15px; font-size: 0.85em; font-weight: 700; }
.properties-box { background: linear-gradient(135deg, #d1fae5, #a7f3d0); border: 2px solid #10b981; border-radius: 12px; padding: 12px; margin: 10px 0; }
.properties-box h3 { color: #065f46; margin-top: 0; }
.properties-box ul { list-style: none; padding: 0; }
.properties-box li { padding: 5px 0; border-bottom: 1px dashed rgba(6,95,70,0.2); font-size: 0.9em; }
.properties-box li:before { content: "✓ "; color: #059669; font-weight: 900; }

.canvas { background: var(--panel); border: 2px solid var(--border); border-radius: 14px; padding: 10px; margin: 10px 0; text-align: center; }
svg { width: 100%; max-width: 550px; height: auto; background: rgba(255,255,255,0.8); border-radius: 10px; }
.pt { cursor: grab; filter: drop-shadow(0 2px 4px var(--shadow)); transition: r 0.2s; }
.pt:hover { r: 14; }
.pt:active { cursor: grabbing; }
.vlabel { font-weight: 900; font-size: 15px; fill: var(--text); }
.smeasure { font-weight: 700; font-size: 12px; fill: var(--accent-dark); }
.alabel { font-weight: 900; font-size: 13px; fill: var(--accent-dark); }

.controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 6px; margin-top: 10px; }
.field { background: #fff; border: 1px solid var(--soft); border-radius: 8px; padding: 5px; text-align: center; }
.field label { display: block; font-size: 0.7em; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.field input { width: 100%; padding: 4px; border: 2px solid var(--soft); border-radius: 6px; text-align: center; font-weight: 700; font-size: 0.9em; color: var(--text); background: #fff; outline: none; }
.field input:focus { border-color: var(--accent); }

.shape-status { margin-top: 10px; padding: 8px; border-radius: 10px; font-weight: 900; font-size: 1em; text-align: center; transition: 0.3s; border: 2px solid transparent; }
.shape-status.success { background: #a7f3d0; color: #064e3b; border-color: #059669; }
.shape-status.fail { background: #fecaca; color: #7f1d1d; border-color: #dc2626; }
.shape-status.normal { background: var(--lighter); color: var(--accent-dark); border-color: var(--accent-dark); }

.btn { background: var(--btn); color: #fff; border: 2px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 18px; font-weight: 700; font-size: 0.9em; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); transition: 0.25s; margin: 3px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.success { background: linear-gradient(135deg, #059669, #10b981); }
.btn.warning { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--soft); }
.btn.help { background: linear-gradient(135deg, #06b6d4, #22d3ee); }
.btn.danger { background: linear-gradient(135deg, #dc2626, #ef4444); }

.stars-bar { display: flex; justify-content: center; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
.star { font-size: 1.3em; color: #e5e7eb; transition: 0.3s; }

.concept-map { background: var(--panel); border: 2px solid var(--border); border-radius: 16px; padding: 15px; margin: 10px 0; box-shadow: 0 4px 15px var(--shadow); }
.concept-map svg { width: 100%; max-width: 800px; height: auto; margin: 0 auto; display: block; }
.map-shape { cursor: pointer; transition: all 0.3s ease; }
.map-shape:hover { filter: drop-shadow(0 6px 15px var(--shadow)) brightness(1.1); transform: scale(1.05); }
.map-line { stroke: var(--accent); stroke-width: 3; fill: none; stroke-dasharray: 6,3; }
.map-label { font-weight: 900; font-size: 17px; fill: var(--text); text-anchor: middle; pointer-events: none; }
.map-condition { font-size: 12.5px; fill: var(--muted); text-anchor: middle; font-weight: 800; }

.dual-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
@media(max-width: 600px) { .dual-split { grid-template-columns: 1fr; } }
.player-zone { background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 10px; position: relative; }
.player-zone.p1 { border-color: #9333ea; }
.player-zone.p2 { border-color: #a855f7; }
.player-zone .zone-label { position: absolute; top: -10px; right: 10px; background: var(--panel); padding: 2px 10px; border-radius: 10px; font-weight: 900; font-size: 0.8em; }
.player-zone.p1 .zone-label { color: #9333ea; }
.player-zone.p2 .zone-label { color: #a855f7; }
.player-zone .zone-score { text-align: center; font-size: 1.5em; font-weight: 900; margin: 5px 0; }
.player-zone.p1 .zone-score { color: #9333ea; }
.player-zone.p2 .zone-score { color: #a855f7; }
.player-zone .zone-opts { display: grid; grid-template-columns: 1fr; gap: 5px; margin-top: 8px; }
.zone-opt { background: #fff; border: 2px solid var(--soft); border-radius: 10px; padding: 10px; cursor: pointer; font-weight: 700; text-align: center; transition: 0.2s; font-size: 0.9em; }
.zone-opt:active { transform: scale(0.97); }
.zone-opt.correct { border-color: #059669; background: #a7f3d0; color: #064e3b; }
.zone-opt.bad { border-color: #dc2626; background: #fecaca; color: #7f1d1d; }
.zone-opt.disabled { opacity: 0.5; pointer-events: none; }

.dual-header { display: flex; justify-content: space-around; align-items: center; margin: 10px 0; padding: 10px; background: var(--panel); border-radius: 12px; border: 2px solid var(--border); }
.dual-timer { font-size: 2em; font-weight: 900; color: var(--accent); }
.dual-timer.urgent { color: #dc2626; animation: pulse 0.7s infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.dual-question-img { width: 100px; height: 100px; margin: 8px auto; display: block; }
.dual-question-img svg { width: 100%; height: 100%; stroke: var(--accent-dark); stroke-width: 3; fill: none; }
.dual-question-text { font-size: 1.1em; font-weight: 800; text-align: center; margin: 8px 0; padding: 10px; background: var(--lighter); border-radius: 10px; }

.instructions-box { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border: 2px solid #c084fc; border-radius: 14px; padding: 15px; margin: 10px 0; }
.instructions-box h3 { color: #6b21a8; margin-top: 0; }
.instructions-box ul { list-style: none; padding: 0; }
.instructions-box li { padding: 6px 0; border-bottom: 1px dashed rgba(107,33,168,0.2); font-size: 0.9em; }

.result-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
@media(max-width: 600px) { .result-cards { grid-template-columns: 1fr; } }
.result-card { background: var(--panel); border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 8px 25px var(--shadow); }
.result-card.winner { border: 3px solid #a855f7; background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }
.result-card.loser { border: 3px solid #3b82f6; }
.result-card .trophy { font-size: 4em; margin-bottom: 10px; }
.result-card h3 { font-size: 1.3em; margin-bottom: 10px; }
.result-card .score { font-size: 2em; font-weight: 900; margin: 10px 0; }
.result-card.winner .score { color: #6b21a8; }

.achievement-sky {
  background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 40%, #f0f9ff 100%);
  min-height: 450px;
  border-radius: 16px;
  padding: 30px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 30px rgba(186, 230, 253, 0.5);
}
.achievement-sky h2 { color: #0c4a6e; text-align: center; margin-bottom: 20px; font-size: 1.8em; text-shadow: 0 2px 4px rgba(255,255,255,0.8); position: relative; z-index: 10; }
.cloud { position: absolute; background: rgba(255, 255, 255, 0.85); border-radius: 100px; z-index: 1; filter: blur(1px); }
.cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); border-radius: 100px; }
.cloud-1 { width: 120px; height: 40px; top: 15%; left: -150px; animation: floatCloud 35s linear infinite; }
.cloud-1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
.cloud-1::after { width: 80px; height: 50px; top: -20px; left: 50px; }
.cloud-2 { width: 100px; height: 35px; top: 35%; left: -150px; animation: floatCloud 45s linear infinite; animation-delay: -15s; opacity: 0.7; }
.cloud-2::before { width: 50px; height: 50px; top: -25px; left: 15px; }
.cloud-2::after { width: 70px; height: 45px; top: -15px; left: 40px; }
.cloud-3 { width: 140px; height: 45px; top: 55%; left: -150px; animation: floatCloud 55s linear infinite; animation-delay: -30s; opacity: 0.6; }
.cloud-3::before { width: 70px; height: 60px; top: -35px; left: 25px; }
.cloud-3::after { width: 90px; height: 55px; top: -25px; left: 60px; }
@keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(calc(100vw + 300px)); } }
.sun { position: absolute; top: 20px; left: 30px; width: 70px; height: 70px; background: radial-gradient(circle, #fde047 0%, #fbbf24 60%, transparent 70%); border-radius: 50%; box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); z-index: 1; animation: sunPulse 4s ease-in-out infinite; }
@keyframes sunPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
.sky-stars { position: relative; min-height: 300px; z-index: 5; }
.sky-star { position: absolute; font-size: 1.8em; animation: twinkle 2.5s infinite; filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8)); }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
.achievement-count { text-align: center; color: #0c4a6e; font-size: 2em; font-weight: 900; margin-top: 20px; text-shadow: 0 2px 4px rgba(255,255,255,0.9); position: relative; z-index: 10; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
.setting-card { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
.setting-card h3 { margin-bottom: 10px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 15px 0; }
.stat-card { background: linear-gradient(135deg, var(--f3), var(--f2)); padding: 14px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 10px var(--shadow); }
.stat-card .l { font-size: 0.85em; color: var(--muted); font-weight: 700; }
.stat-card .v { font-size: 1.4em; font-weight: 900; margin-top: 4px; color: var(--accent-dark); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fade 0.3s; }
.modal-box { background: #fff; padding: 25px; border-radius: 16px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
.modal-box h3 { color: var(--accent-dark); margin-bottom: 15px; font-size: 1.3em; }

.toast { position: fixed; bottom: 15px; right: 15px; background: var(--text); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 0.9em; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 999; opacity: 0; transform: translateY(20px); transition: 0.3s; }
.toast.show { opacity: 1; transform: none; }

select, input[type="text"] { width: 100%; padding: 10px; border: 2px solid var(--soft); border-radius: 10px; font-size: 1em; font-weight: 700; outline: none; transition: 0.3s; }
select:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }

@media(max-width: 600px) {
  .school-header h1 { font-size: 1.1em; }
  .header-row-2 { flex-direction: column; align-items: center; }
  main { padding: 10px; }
  .tab { font-size: 0.65em; min-width: 70px; max-width: 90px; padding: 6px 6px; }
}
</style>
</head>

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));

  return a;
}

function getDefaultShape(key) {
  if (key === 'square') return [{x:200,y:100},{x:400,y:100},{x:400,y:300},{x:200,y:300}];
  if (key === 'rect') return [{x:150,y:120},{x:450,y:120},{x:450,y:280},{x:150,y:280}];
  if (key === 'rhombus') return [{x:300,y:80},{x:450,y:190},{x:300,y:300},{x:150,y:190}];
  if (key === 'para') return [{x:150,y:120},{x:400,y:120},{x:450,y:280},{x:200,y:280}];
  return [{x:150,y:100},{x:450,y:100},{x:400,y:300},{x:200,y:300}];
}

function interior(p, prev, next) {
  var v1x = prev.x - p.x, v1y = prev.y - p.y;
  var v2x = next.x - p.x, v2y = next.y - p.y;
  var dot = v1x * v2x + v1y * v2y;
  var cross = v1x * v2y - v1y * v2x;
  var d = deg(Math.atan2(Math.abs(cross), dot));
  if (d > 180) d = 360 - d;
  return d;
}
function anglesOf(P) { return [0,1,2,3].map(function(i) { return interior(P[i], P[(i+3)%4], P[(i+1)%4]); }); }

function drawShape(key, prefix, isGame) {
  var stateObj = gameState[key];
  if (!stateObj || !stateObj.P) return;
  var P = stateObj.P;
  var svg = el(prefix + key);
  if (!svg) return;
  var cs = getComputedStyle(document.body);
  var st = cs.getPropertyValue('--stroke');
  var f1 = cs.getPropertyValue('--f1'), f3 = cs.getPropertyValue('--f3');
  var s = '<defs><linearGradient id="g-' + key + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="' + f1 + '" stop-opacity=".7"/><stop offset="100%" stop-color="' + f3 + '" stop-opacity=".8"/></linearGradient></defs>';
  if (isGame) {
    for (var x = 40; x < 600; x += 40) s += '<line x1="' + x + '" y1="20" x2="' + x + '" y2="360" stroke="var(--border)" stroke-width="1" opacity="0.5"/>';
    for (var y = 30; y < 380; y += 40) s += '<line x1="20" y1="' + y + '" x2="580" y2="' + y + '" stroke="var(--border)" stroke-width="1" opacity="0.5"/>';
  }
  s += '<polygon points="' + P.map(function(p) { return p.x + ',' + p.y; }).join(' ') + '" fill="url(#g-' + key + ')" stroke="' + st + '" stroke-width="3" stroke-linejoin="round"/>';
  var sd = [dst(P[0],P[1]), dst(P[1],P[2]), dst(P[2],P[3]), dst(P[3],P[0])];
  var an = anglesOf(P);
  var pairs = [[0,1],[1,2],[2,3],[3,0]];
  for (var i = 0; i < pairs.length; i++) {
    var mx = (P[pairs[i][0]].x + P[pairs[i][1]].x) / 2;
    var my = (P[pairs[i][0]].y + P[pairs[i][1]].y) / 2;
    s += '<text class="smeasure" x="' + mx + '" y="' + (my-8) + '" text-anchor="middle">' + sd[i].toFixed(1) + '</text>';
  }
  var off = [[-38,28],[38,28],[38,-18],[-38,-18]];
  for (var i = 0; i < an.length; i++) s += '<text class="alabel" x="' + (P[i].x+off[i][0]) + '" y="' + (P[i].y+off[i][1]) + '" text-anchor="middle">' + 'ABCD'[i] + '=' + an[i].toFixed(0) + '°</text>';
  for (var i = 0; i < P.length; i++) {
    s += '<circle class="pt" cx="' + P[i].x + '" cy="' + P[i].y + '" r="10" fill="' + st + '" data-k="' + key + '" data-i="' + i + '"/>';
    s += '<text class="vlabel" x="' + (P[i].x+(i<2?-18:14)) + '" y="' + (P[i].y+(i%2?22:-12)) + '">' + 'ABCD'[i] + '</text>';
  }
  svg.innerHTML = s;
  if (isGame) { updateInputs(key, P); updateBadge(key, P); }
}

function updateInputs(key, P) {
  var sd = [dst(P[0],P[1]), dst(P[1],P[2]), dst(P[2],P[3]), dst(P[3],P[0])];
  var an = anglesOf(P);
  for (var i = 0; i < sd.length; i++) { var inp = el('in-game-'+key+'-s'+i); if (inp) inp.value = sd[i].toFixed(1); }
  for (var i = 0; i < an.length; i++) { var inp = el('in-game-'+key+'-g'+i); if (inp) inp.value = an[i].toFixed(0); }
}

function updateBadge(key, P) {
  var sd = [dst(P[0],P[1]), dst(P[1],P[2]), dst(P[2],P[3]), dst(P[3],P[0])];
  var an = anglesOf(P);
  var tol = 0.5;
  var allSidesEq = Math.max.apply(null, sd) - Math.min.apply(null, sd) <= tol;
  var oppSidesEq = Math.abs(sd[0]-sd[2]) <= tol && Math.abs(sd[1]-sd[3]) <= tol;
  var all90 = an.every(function(a) { return Math.abs(a-90) <= tol; });
  var status = { name: "⚠️ شكل رباعي عام", type: "fail" };
  if (all90 && allSidesEq) status = { name: "🟦 مربع ✓", type: "success" };
  else if (all90 && oppSidesEq) status = { name: "📐 مستطيل ✓", type: "success" };
  else if (allSidesEq) status = { name: "💎 معين ✓", type: "success" };
  else if (oppSidesEq) status = { name: "📏 متوازي أضلاع", type: "normal" };
  var badge = el('status-game-'+key);
  if (badge) { badge.textContent = status.name; badge.className = 'shape-status ' + status.type; }
}

var drag = null;
document.addEventListener('pointerdown', function(e) {
  var t = e.target.closest('.pt');
  if (!t) return;
  drag = { k: t.dataset.k, i: +t.dataset.i };
  e.preventDefault();
});
document.addEventListener('pointermove', function(e) {
  if (!drag) return;
  var svg = el('svg-game-' + drag.k);
  if (!svg) return;
  var r = svg.getBoundingClientRect();
  var mx = (e.clientX - r.left) * 600 / r.width;
  var my = (e.clientY - r.top) * 380 / r.height;
  var P = gameState[drag.k].P;
  var gs = 20;
  var snapX = Math.round(mx/gs)*gs;
  var snapY = Math.round(my/gs)*gs;
  var useSnap = Math.abs(mx-snapX)<10 && Math.abs(my-snapY)<10;
  P[drag.i].x = Math.max(20, Math.min(580, useSnap?snapX:mx));
  P[drag.i].y = Math.max(20, Math.min(360, useSnap?snapY:my));
  drawShape(drag.k, 'svg-game-', true);
});
document.addEventListener('pointerup', function() { drag = null; });
document.addEventListener('pointercancel', function() { drag = null; });

function manualEdit(key, type, idx, val) {
  var v = parseFloat(val);
  if (!isFinite(v) || v <= 0) return;
  var P = gameState[key].P;
  if (type === 's') {
    var i = idx, j = (idx+1)%4;
    var dx = P[j].x-P[i].x, dy = P[j].y-P[i].y;
    var len = Math.hypot(dx,dy);
    if (len > 0.01) { var r = v/len; P[j].x = P[i].x+dx*r; P[j].y = P[i].y+dy*r; }
  } else if (type === 'g') {
    var i = idx, prev = (i+3)%4, next = (i+1)%4;
    var angPrev = Math.atan2(P[prev].y-P[i].y, P[prev].x-P[i].x);
    var newAngle = angPrev - rad(v);
    var dist = dst(P[i], P[next]);
    P[next].x = P[i].x + Math.cos(newAngle)*dist;
    P[next].y = P[i].y + Math.sin(newAngle)*dist;
  }
  drawShape(key, 'svg-game-', true);
}

function resetToDefault(key) {

function helpRestore(key) {
  var state = gameState[key];
  var P = state.P;
  var sd = [dst(P[0],P[1]), dst(P[1],P[2]), dst(P[2],P[3]), dst(P[3],P[0])];
  var an = anglesOf(P);
  var tol = 0.5;
  var hint = '';
  if (key === 'rect') {
    var wrongAngles = an.filter(function(a) { return Math.abs(a-90) > tol; }).length;
    var oppEq = Math.abs(sd[0]-sd[2]) <= tol && Math.abs(sd[1]-sd[3]) <= tol;
    if (wrongAngles > 0) hint = 'الخطوة 1: اسحب النقاط حتى تصبح كل الزوايا 90° (الآن ' + wrongAngles + ' زوايا غير صحيحة)';
    else if (!oppEq) hint = 'الخطوة 2: اجعل الأضلاع المتقابلة متساوية (AB=CD و BC=DA)';
    else hint = 'الشكل جاهز! اضغط "تحقق" لتربح نجمة ⭐';
  } else if (key === 'rhombus') {
    var maxDiff = Math.max.apply(null, sd) - Math.min.apply(null, sd);
    if (maxDiff > tol) hint = 'اجعل كل الأضلاع متساوية الطول (الفرق الحالي: ' + maxDiff.toFixed(1) + ' سم)';
    else hint = 'الشكل جاهز! اضغط "تحقق" لتربح نجمة ⭐';
  } else if (key === 'square') {
    var wrongAngles = an.filter(function(a) { return Math.abs(a-90) > tol; }).length;
    var maxDiff = Math.max.apply(null, sd) - Math.min.apply(null, sd);
    if (wrongAngles > 0 && maxDiff > tol) hint = 'ابدأ بتسوية الأضلاع أولاً، ثم اجعل الزوايا 90°';
    else if (wrongAngles > 0) hint = 'الأضلاع متساوية ✓ الآن اجعل الزوايا 90°';
    else if (maxDiff > tol) hint = 'الزوايا صحيحة ✓ الآن سوِّ الأضلاع';
    else hint = 'الشكل جاهز! اضغط "تحقق" لتربح نجمة ⭐';
  } else if (key === 'para') {
    var diff1 = Math.abs(sd[0]-sd[2]);
    var diff2 = Math.abs(sd[1]-sd[3]);
    if (diff1 > tol || diff2 > tol) hint = 'اجعل الأضلاع المتقابلة متساوية (AB=CD و BC=DA)';
    else hint = 'الشكل جاهز! اضغط "تحقق" لتربح نجمة ⭐';
  }
  showHelpModal(key, hint);
}

function showHelpModal(key, hint) {

  modal.innerHTML = '<div class="modal-box"><h3>💡 مساعدة - ' + CFG[key].name + '</h3><p style="background:var(--lighter);padding:10px;border-radius:10px;margin:10px 0">' + hint + '</p><p style="font-size:0.9em;color:var(--muted)">هل تريدين إعادة الشكل لما كان عليه قبل التعديل؟</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn help" id="btn-restore">↺ نعم، أعيد الشكل</button><button class="btn ghost" id="btn-close">لا، سأكمل</button></div></div>';
  document.body.appendChild(modal);
  modal.querySelector('#btn-restore').addEventListener('click', function() {
    var state = gameState[key];

      drawShape(key, 'svg-game-', true);

    }

  });
  modal.querySelector('#btn-close').addEventListener('click', function() { modal.remove(); });
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

function checkTransform(key) {
  var P = gameState[key].P;
  var sd = [dst(P[0],P[1]), dst(P[1],P[2]), dst(P[2],P[3]), dst(P[3],P[0])];
  var an = anglesOf(P);
  var tol = 0.5;
  var allSidesEq = Math.max.apply(null, sd) - Math.min.apply(null, sd) <= tol;
  var oppSidesEq = Math.abs(sd[0]-sd[2]) <= tol && Math.abs(sd[1]-sd[3]) <= tol;
  var all90 = an.every(function(a) { return Math.abs(a-90) <= tol; });
  var success = false;
  if (key === 'rect') success = all90 && oppSidesEq;
  else if (key === 'rhombus') success = allSidesEq;
  else if (key === 'square') success = all90 && allSidesEq;
  else if (key === 'para') success = oppSidesEq;
  if (success) {
    shapesCompleted++;
    addStar();
    toast(' أحسنت! نجمة جديدة ⭐ (أشكال محولة: ' + shapesCompleted + ')');

  }
}

  var playerName = player === 1 ? dualPlayers.p1 : dualPlayers.p2;
  if (idx === dual.q.ans) {
    node.classList.add('correct');
    for (var i = 0; i < opts.length; i++) opts[i].classList.add('disabled');
    if (player === 1) dual.p1++; else dual.p2++;
    toast('⭐ ' + playerName + ' أجابت صح!');
    updateDualUI();
    setTimeout(function() { if (dual.active) nextDualQ(); }, 800);
  } else {
    node.classList.add('bad');
    node.classList.add('disabled');
    toast('❌ ' + playerName + ' أجابت خطأ! حاولي خياراً آخر');
    updateDualUI();
    var remaining = 0;
    for (var i = 0; i < opts.length; i++) {
      if (!opts[i].classList.contains('disabled')) remaining++;
    }
    if (remaining <= 1) {
      for (var i = 0; i < opts.length; i++) {
        if (i === dual.q.ans) { opts[i].classList.add('correct'); opts[i].classList.add('disabled'); }
      }
      toast('💡 الإجابة الصحيحة: ' + dual.q.opts[dual.q.ans]);
      setTimeout(function() { if (dual.active) nextDualQ(); }, 1200);
    }
  }
}

function endDual() {
  dual.active = false;
  clearInterval(dual.timer);
  challengesCompleted++;
  updateStatsUI();
  el('dualGame').style.display = 'none';
  el('dualResult').style.display = 'block';
  var resultHTML = '<h2 style="text-align:center;margin-bottom:20px">🏆 نتائج المنافسة 🏆</h2>';
  resultHTML += '<div class="result-cards">';
  if (dual.p1 > dual.p2) {
    resultHTML += '<div class="result-card winner"><div class="trophy">🏆</div><h3>درع التميز</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p1 + '</p><div class="score">' + dual.p1 + ' ⭐</div><p>أحسنتِ! أداء متميز 🌟</p></div>';
    resultHTML += '<div class="result-card loser"><div class="trophy">📜</div><h3>شهادة شكر وتقدير</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p2 + '</p><div class="score">' + dual.p2 + ' ⭐</div><p>شكراً لمشاركتكِ! 💪</p></div>';
  } else if (dual.p2 > dual.p1) {
    resultHTML += '<div class="result-card loser"><div class="trophy">📜</div><h3>شهادة شكر وتقدير</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p1 + '</p><div class="score">' + dual.p1 + ' ⭐</div><p>شكراً لمشاركتكِ! 💪</p></div>';
    resultHTML += '<div class="result-card winner"><div class="trophy">🏆</div><h3>درع التميز</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p2 + '</p><div class="score">' + dual.p2 + ' ⭐</div><p>أحسنتِ! أداء متميز </p></div>';
  } else {
    resultHTML += '<div class="result-card winner"><div class="trophy">🤝</div><h3>تعادل!</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p1 + ' و ' + dualPlayers.p2 + '</p><div class="score">' + dual.p1 + ' ⭐</div><p>أداء متساوي ومتميز! 🌟</p></div>';
    resultHTML += '<div class="result-card winner"><div class="trophy">🤝</div><h3>تعادل!</h3><p style="font-size:1.2em;font-weight:900">' + dualPlayers.p1 + ' و ' + dualPlayers.p2 + '</p><div class="score">' + dual.p2 + ' ⭐</div><p>أداء متساوي ومتميز! 🌟</p></div>';
  }
  resultHTML += '</div>';
  resultHTML += '<div style="text-align:center;margin-top:20px"><button class="btn success" onclick="resetDual()" style="font-size:1.1em;padding:12px 30px">🔄 تحدي ثنائي جديد</button></div>';
  el('dualResult').innerHTML = resultHTML;
  addStar(dual.p1 + dual.p2);
}

function resetDual() {
  dual.active = false;
  clearInterval(dual.timer);
  dual.left = 120; dual.p1 = 0; dual.p2 = 0;
  dual.queue = []; dual.answered = [false, false];
  availableNames = studentNames.slice();
  el('dualResult').style.display = 'none';
  el('dualGame').style.display = 'none';
  el('dualInstructions').style.display = 'block';
  el('dt').textContent = '120';
  el('dt').classList.remove('urgent');
  updateDualUI();
  toast('🔄 تم إعادة تهيئة المنافسة!');
}

function setTheme(t) {
  document.body.dataset.theme = t;
  var keys = Object.keys(CFG);
  for (var i = 0; i < keys.length; i++) drawShape(keys[i], 'svg-game-', true);
  toast('🎨 تم تغيير الثيم إلى: ' + (t === 'purple' ? 'بنفسجي' : 'وردي'));
}

function resetStars() {
  if (confirm('هل أنتِ متأكدة من تصفير جميع النجوم؟')) {
    stars = 0;
    updateStarsUI();
    toast('️ تم تصفير النجوم');
  }
}

function resetChallenges() {
  if (confirm('هل أنتِ متأكدة من تصفير جميع التحديات؟\n\nسيتم إعادة:\n• عدد الأشكال المحولة إلى 0\n• عدد التحديات المكتملة إلى 0\n\n(لن يتم تصفير النجوم)')) {
    shapesCompleted = 0;
    challengesCompleted = 0;
    updateStatsUI();
    toast('🔄 تم تصفير التحديات!');
  }
}

function resetAll() {
  if (confirm('⚠️ تحذير: سيتم تصفير كل شيء!\n\n• النجوم → 0\n• الأشكال المحولة → 0\n• التحديات المكتملة → 0\n\nهل أنتِ متأكدة؟')) {
    stars = 0;
    shapesCompleted = 0;
    challengesCompleted = 0;
    updateStarsUI();
    updateStatsUI();
    toast('🗑️ تم تصفير كل شيء!');
  }
}

buildTabs();
buildSections();

var keys = Object.keys(CFG);
for (var i = 0; i < keys.length; i++) {
  var k = keys[i];
  var initialP = getDefaultShape(k).map(function(p) { return {x:p.x,y:p.y}; });
  gameState[k] = { P: initialP, saved: initialP.map(function(p) { return {x:p.x,y:p.y}; }) };
  drawShape(k, 'svg-game-', true);
}

setTimeout(function() {
  var shapes = document.querySelectorAll('.map-shape');
  for (var i = 0; i < shapes.length; i++) {
    (function(shape) {
      shape.addEventListener('click', function(e) {
        e.preventDefault();
        var target = shape.dataset.target;
        if (target) go(target);
      });
    })(shapes[i]);
  }
}, 100);

updateStarsUI();
updateStatsUI();
</script>
</body>
</html>
